name: urmotiv

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在私有环境文件中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在私有环境文件中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在私有环境文件中设置 POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"
          pids: 512

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
          pids: 256

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在私有环境文件中设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在私有环境文件中设置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
          pids: 512

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请在私有环境文件中设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在私有环境文件中设置 MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:?请在私有环境文件中设置 S3_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set urmotiv http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing "urmotiv/$$S3_BUCKET";
        mc anonymous set none "urmotiv/$$S3_BUCKET"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.1"
          pids: 128

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "@urmotiv/api", "migrate"]
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.2"
          pids: 128

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JOB_REDIS_PREFIX: ${JOB_REDIS_PREFIX:-urmotiv:jobs}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?请在私有环境文件中设置 S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?请在私有环境文件中设置 MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在私有环境文件中设置 MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      URMOTIV_WEB_ORIGIN: ${URMOTIV_WEB_ORIGIN:?请在私有环境文件中设置 URMOTIV_WEB_ORIGIN}
      URMOTIV_TRUSTED_PROXY_CIDRS: ${URMOTIV_TRUSTED_PROXY_CIDRS:-}
      URMOTIV_PLUGIN_SECRET_KEY: ${URMOTIV_PLUGIN_SECRET_KEY:?请在私有环境文件中设置 URMOTIV_PLUGIN_SECRET_KEY}
      URMOTIV_EMAIL_LOGIN_ENABLED: ${URMOTIV_EMAIL_LOGIN_ENABLED:-true}
      URMOTIV_EMAIL_REGISTRATION_ENABLED: ${URMOTIV_EMAIL_REGISTRATION_ENABLED:-false}
      URMOTIV_USTC_OAUTH_ENABLED: ${URMOTIV_USTC_OAUTH_ENABLED:-false}
      URMOTIV_USTC_OAUTH_AUTHORIZE_URL: ${URMOTIV_USTC_OAUTH_AUTHORIZE_URL:-}
      URMOTIV_USTC_OAUTH_TOKEN_URL: ${URMOTIV_USTC_OAUTH_TOKEN_URL:-}
      URMOTIV_USTC_OAUTH_PROFILE_URL: ${URMOTIV_USTC_OAUTH_PROFILE_URL:-}
      URMOTIV_USTC_OAUTH_REDIRECT_URI: ${URMOTIV_USTC_OAUTH_REDIRECT_URI:-}
      URMOTIV_USTC_OAUTH_CLIENT_ID: ${URMOTIV_USTC_OAUTH_CLIENT_ID:-}
      URMOTIV_USTC_OAUTH_CLIENT_SECRET: ${URMOTIV_USTC_OAUTH_CLIENT_SECRET:-}
      URMOTIV_USTC_OAUTH_STATE_SECRET: ${URMOTIV_USTC_OAUTH_STATE_SECRET:-}
      URMOTIV_USTC_OAUTH_SCOPE: ${URMOTIV_USTC_OAUTH_SCOPE:-}
      URMOTIV_CAS_ENABLED: ${URMOTIV_CAS_ENABLED:-false}
      URMOTIV_CAS_LOGIN_URL: ${URMOTIV_CAS_LOGIN_URL:-}
      URMOTIV_CAS_VALIDATE_URL: ${URMOTIV_CAS_VALIDATE_URL:-}
      URMOTIV_CAS_CALLBACK_URL: ${URMOTIV_CAS_CALLBACK_URL:-}
      URMOTIV_CAS_SUBJECT_ATTRIBUTE: ${URMOTIV_CAS_SUBJECT_ATTRIBUTE:-}
      URMOTIV_CAS_EMAIL_ATTRIBUTE: ${URMOTIV_CAS_EMAIL_ATTRIBUTE:-}
      URMOTIV_CAS_NICKNAME_ATTRIBUTE: ${URMOTIV_CAS_NICKNAME_ATTRIBUTE:-}
      URMOTIV_CAS_STUDENT_ID_ATTRIBUTES: ${URMOTIV_CAS_STUDENT_ID_ATTRIBUTES:-}
      URMOTIV_CAS_STATE_SECRET: ${URMOTIV_CAS_STATE_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"
          pids: 1024

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379/0
      JOB_REDIS_PREFIX: ${JOB_REDIS_PREFIX:-urmotiv:jobs}
      WORKER_HEALTH_HOST: 127.0.0.1
      WORKER_HEALTH_PORT: "3010"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # worker 自带健康服务：/ready 在最近一次队列进展超过阈值（默认 60 秒）后返回 503，
      # 用来识别进程还活着但已经卡住的情况；连接失败表示进程已经死亡。
      # 两种失败都让健康检查不通过；配合 restart: unless-stopped 与 worker 自身的
      # 连续不通过退出逻辑，卡住的 worker 会被重新拉起。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/ready').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: "1.5"
          pids: 1024

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${URMOTIV_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health | grep -q 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.4"
          pids: 512

  # Anklang 是独立仓库的原题检索服务，不连接 Urmotiv 的数据库、Redis 或对象存储。
  # 默认不启动；只有显式启用 anklang profile 时才加入当前 Compose 项目。
  # build 假定 Anklang 与本仓库以同级目录检出。服务令牌和外部服务密钥只从
  # Anklang 自己被 Git 忽略的 private/anklang.env 注入，不进入 Urmotiv 环境文件。
  anklang:
    build:
      context: ../Anklang
    restart: unless-stopped
    profiles: ["anklang"]
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.2"
          pids: 128
    env_file:
      - path: ../Anklang/private/anklang.env
        required: true
    environment:
      ANKLANG_BIND_HOST: "0.0.0.0"
      ANKLANG_PORT: "8730"
      ANKLANG_REQUIRE_SERVICE_TOKEN: "true"
      ANKLANG_SHUTDOWN_GRACE_SECONDS: "30"
    ports:
      - "127.0.0.1:8730:8730"
    volumes:
      - anklang-problems-data:/app/problems-data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}));
          response=opener.open('http://127.0.0.1:8730/api/v1/live', timeout=2);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 5s
    stop_grace_period: "45s"

  # Fermata 是独立仓库的 AI 审核实验服务：用机器人令牌领取、续租并提交审题任务，
  # 不直接连接 Postgres、Redis 或 MinIO。它与主应用之间通过管理后台的
  # “Fermata 审核服务管理”插件设置（baseUrl、超时）对接，不经过环境变量。
  # 默认不随 `docker compose up` 启动；需要显式启用对应 profile，例如
  # `docker compose --profile fermata up -d` 或设置环境变量 COMPOSE_PROFILES=fermata。
  # 下面的 build 假定 Fermata 与本仓库以同级目录检出（.../Fermata 与 .../Urmotiv 同级）；
  # 如果服务器上的实际路径不同，或改为拉取已发布镜像，把 build 换成
  # image: <镜像仓库>/fermata:<tag>。
  fermata:
    build:
      context: ../Fermata
    restart: unless-stopped
    profiles: ["fermata"]
    env_file:
      # 与 urmotiv.env 分开存放：Fermata 自己的模型 / 服务凭据不进入主应用的环境文件，
      # 放在 Fermata 仓库内被 Git 整体忽略的 private/fermata.env。
      - path: ../Fermata/private/fermata.env
        required: true
    ports:
      - "127.0.0.1:8720:8720"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 镜像基于 node:24-alpine（没有 curl），用 Node 自带的 fetch 探测无鉴权的 /healthz。
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8720/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: "1.0"
          pids: 1024

volumes:
  postgres-data:
  redis-data:
  minio-data:
  anklang-problems-data:
